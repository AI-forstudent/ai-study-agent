name: New Idea
description: Capture a product idea. Claude only analyzes ideas you've moved to the Ready for Analysis column.
title: "[Idea] "
labels: ["area:idea"]
body:
  - type: markdown
    attributes:
      value: |
        This issue will land in the **Drafts** column of the [Ideas Pipeline project](https://github.com/orgs/AI-forstudent/projects/1). Claude does **not** analyze drafts.

        When the idea is ripe and you want a verdict + effort estimate + design, move the card to the **Ready for Analysis** column. The next weekday morning at 09:00, Claude will post the analysis as a comment and move the card to **Idea Summary**.

  - type: textarea
    id: motivation
    attributes:
      label: Problem / Motivation
      description: What pain point or opportunity does this address?
      placeholder: e.g. "Users abandon course creation halfway through"
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Rough Idea
      description: What you'd want it to do — even at a high level. Don't worry about implementation details.
      placeholder: "When a user does X, the system should Y, so that Z"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else (optional)
      description: References, screenshots, links, related issues. Add a `priority:high|med|low` label manually if you have a strong feeling about urgency — otherwise the daily analysis will infer one.
