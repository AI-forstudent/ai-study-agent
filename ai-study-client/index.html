<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>ai-study-client</title>
    <!-- Google Identity Services — populates window.google.accounts.id.
         Loaded async so it never blocks the React boot. The AuthModal waits
         for window.google before rendering the Google Sign-In button. -->

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
