# הפניה מ-HTTP ל-HTTPS
server {
    listen 80;
    server_name ai-study-agent.com www.ai-study-agent.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# שרת ה-HTTPS הראשי
server {
    listen 443 ssl;
    server_name ai-study-agent.com www.ai-study-agent.com;

    # נתיבים לתעודות ה-SSL של Certbot (וודא שהדומיין תואם למה שהגדרת בשרת)
    ssl_certificate /etc/letsencrypt/live/ai-study-agent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-study-agent.com/privkey.pem;

    # הגדרות אבטחה בסיסיות ל-SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. הגשת קבצי הפרונטאנד (React)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # פתרון לשגיאות 404 בניווט של React Router
        try_files $uri $uri/ /index.html;
    }

    # 2. העברת בקשות לבקאנד (FastAPI)
    # שימו לב: ההנחה כאן היא שכל קריאות ה-API מתחילות ב-/api/
location /api/ {
        # גוזר את ה-/api/ ומעביר הלאה רק את מה שאחריו
        rewrite ^/api/(.*)$ /$1 break; 
        
        proxy_pass http://backend:8000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}