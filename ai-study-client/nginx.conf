# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name ai-study-agent.com www.ai-study-agent.com;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ai-study-agent.com www.ai-study-agent.com;

    ssl_certificate     /etc/letsencrypt/live/ai-study-agent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-study-agent.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Serve the React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy all API calls to the unified backend (port 8001).
    #    No rewrite: /api/v1/* is passed through intact — backend routes match exactly.
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Proxy uploaded PDF files served by FastAPI StaticFiles.
    location /uploads/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Proxy the health endpoint.
    location /health {
        proxy_pass http://backend:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
